<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Battleship</h1>
  
  <div id="message-area">Prepare your fleet!</div>
  
  <!-- Setup controls (hidden during actual game) -->
  <div id="setup-panel">
    <h2 id="setup-instruction">Place your Carrier (Length: 5)</h2>
    <button id="rotate-btn">Orientation: Horizontal</button>
  </div>

  <div id="game-container">
    <div class="board-wrapper">
      <h2>Your Fleet</h2>
      <div id="player-board" class="board"></div>
    </div>
    
    <div class="board-wrapper">
      <h2>Enemy Waters</h2>
      <div id="computer-board" class="board"></div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
